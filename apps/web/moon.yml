$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'npm run dev'
    options:
      runInCI: false  # dev server: skipped in CI, never cached

  build:
    command: 'npm run build'
    inputs:
      - 'src/**/*'
      - 'public/**/*'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '/packages/sdk-ts/src/**/*'
    outputs:
      - 'dist'

  test:
    command: 'npm run test'
    inputs:
      - 'src/**/*'
      - 'scripts/**/*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '/packages/sdk-ts/src/**/*'

  boundaries-check:
    command: 'npm run boundaries:check'
    inputs: ['src/**/*', 'scripts/**/*', 'package.json']
