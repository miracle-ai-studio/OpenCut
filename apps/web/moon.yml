$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'bun run dev'
    options:
      runInCI: false  # dev server: skipped in CI, never cached

  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'public/**/*'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/sdk-ts/src/contracts.generated.ts'
    outputs:
      - 'dist'

  test:
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - '/packages/sdk-ts/src/contracts.generated.ts'

  contracts-check:
    command: 'bun run contracts:check'
    inputs:
      - 'src/editor/generate-contracts.mjs'
      - 'src/lib/editor-contracts.generated.ts'
      - 'package.json'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/**/*'
      - '/apps/cli/**/*'
      - '/packages/sdk-ts/scripts/**/*'
      - '/packages/sdk-ts/src/contracts.generated.ts'
      - '/packages/contract-fixtures/**/*'

  deploy:
    command: 'bun run deploy'
    deps:
      - '~:build'
