$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
tasks:
  check:
    command: 'cargo check -p opencut-cli'
  test:
    command: 'cargo test -p opencut-cli'
  build:
    command: 'cargo build --release -p opencut-cli'
    outputs:
      - '/target/release/opencut'
  access-audit-acceptance:
    command: 'python3 ../../scripts/verify-access-audit.py --binary ../../target/debug/opencut'
    options:
      cache: false
      runInCI: false
  audit-acceptance:
    command: 'python3 ../../scripts/verify-audit.py --binary ../../target/debug/opencut'
    options:
      cache: false
      runInCI: false
  maintenance-acceptance:
    command: 'python3 ../../scripts/verify-maintenance.py --binary ../../target/debug/opencut'
    options:
      cache: false
      runInCI: false
  mcp-http-acceptance:
    command: 'python3 ../../scripts/verify-mcp-http.py --binary ../../target/debug/opencut'
    options:
      cache: false
      runInCI: false
  scoped-preflight-acceptance:
    command: 'python3 ../../scripts/verify-scoped-preflight.py --binary ../../target/debug/opencut'
    options:
      cache: false
      runInCI: false
