$schema: 'https://moonrepo.dev/schemas/project.json'

tasks:
  architecture:
    command: 'python3 scripts/check-architecture.py'
    options:
      cache: false
  architecture-tests:
    command: "python3 -m unittest discover -s scripts/tests -p test_architecture.py"
    inputs:
      - 'scripts/check-architecture.py'
      - 'scripts/tests/test_architecture.py'
  typescript-boundaries:
    command: 'node packages/sdk-ts/scripts/check-boundaries.mjs'
    options:
      cache: false
  web-boundaries:
    command: 'node apps/web/scripts/check-boundaries.mjs'
    options:
      cache: false
