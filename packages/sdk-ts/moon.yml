$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'
layer: 'library'
tasks:
  build:
    command: 'npm run build'
    inputs: ['src/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
    outputs: ['dist']
  test:
    command: 'npm test'
    inputs: ['src/**/*', 'tests/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
  contracts-check:
    command: 'npm run contracts:check'
    inputs: ['scripts/**/*', 'src/contracts.generated.ts', '/packages/contract-fixtures/**/*', '/apps/web/src/lib/editor-contracts.generated.ts', '/Cargo.toml', '/Cargo.lock', '/crates/**/*', '/apps/cli/**/*']
  acceptance:
    command: 'node ../../scripts/verify-sdk.mjs'
    options:
      cache: false
      runInCI: false
  public-jobs-acceptance:
    command: 'python3 ../../scripts/verify-public-job-views.py'
    options:
      cache: false
      runInCI: false
