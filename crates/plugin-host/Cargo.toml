[package]
name = "opencut-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencut-storage-budget = { path = "../storage-budget" }
opencut-api-contracts = { path = "../api-contracts" }
opencut-contracts = { path = "../contracts" }
opencut-editor-application = { path = "../editor-application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10.9"
semver = { version = "1", features = ["serde"] }
jsonschema = { version = "0.56", default-features = false }
fs2 = "0.4"
wasmtime = { version = "38.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "38.0.4", default-features = false, features = ["p2"] }

[dev-dependencies]
opencut-editor-core = { path = "../editor-core" }
tempfile = "3"
opencut-sqlite-store = { path = "../sqlite-store" }
