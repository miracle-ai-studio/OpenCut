[package]
name = "opencut-automation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencut-native-services = { path = "../native-services" }
opencut-sqlite-store = { path = "../sqlite-store" }
opencut-api-contracts = { path = "../api-contracts" }
opencut-contracts = { path = "../contracts" }
opencut-editor-application = { path = "../editor-application" }
opencut-editor-core = { path = "../editor-core" }
opencut-job-contracts = { path = "../job-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
