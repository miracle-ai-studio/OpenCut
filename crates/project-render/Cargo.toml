[package]
name = "opencut-project-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencut-composition = { path = "../composition" }
opencut-api-contracts = { path = "../api-contracts" }
opencut-contracts = { path = "../contracts" }
opencut-editor-core = { path = "../editor-core" }
opencut-media = { path = "../media" }
opencut-time = { path = "../time" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
