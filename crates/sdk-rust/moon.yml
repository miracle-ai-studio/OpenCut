$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'library'
tasks:
  test:
    command: 'cargo test -p opencut-sdk'
    inputs: ['src/**/*', 'Cargo.toml', '/Cargo.lock', '/crates/api-contracts/**/*', '/crates/job-contracts/**/*', '/crates/media-contracts/**/*', '/crates/contracts/**/*']
  contracts-check:
    command: 'python3 ../../scripts/check-contract-boundaries.py'
    inputs: ['/scripts/check-contract-boundaries.py', '/Cargo.toml', '/Cargo.lock', '/crates/**/*', '/apps/cli/Cargo.toml', '/apps/desktop/Cargo.toml']
  acceptance:
    command: 'python3 ../../scripts/verify-rust-sdk.py'
    options:
      cache: false
      runInCI: false
  canonical-contract:
    command: 'python3 ../../scripts/check-canonical-contract.py'
    inputs: ['/scripts/check-canonical-contract.py', '/Cargo.toml', '/Cargo.lock', '/crates/**/*', '/apps/cli/**/*']
