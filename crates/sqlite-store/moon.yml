$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'library'
tasks:
  test:
    command: 'cargo test -p opencut-sqlite-store'
    inputs: ['src/**/*', 'Cargo.toml', '/Cargo.lock', '/crates/editor-application/**/*', '/crates/contracts/**/*', '/crates/asset-store/**/*', '/crates/api-contracts/**/*']
  transaction-acceptance:
    command: 'python3 ../../scripts/verify-project-transactions.py'
    options:
      cache: false
      runInCI: false
  recovery-acceptance:
    command: 'python3 ../../scripts/verify-asset-recovery.py --binary ../../target/debug/opencut --crash-point after-rename'
    options:
      cache: false
      runInCI: false
  history-acceptance:
    command: 'python3 ../../scripts/verify-history-compatibility.py'
    options:
      cache: false
      runInCI: false
