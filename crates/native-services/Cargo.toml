[package]
name = "opencut-native-services"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencut-storage-budget = { path = "../storage-budget" }
opencut-editor-application = { path = "../editor-application" }
opencut-api-contracts = { path = "../api-contracts" }
opencut-contracts = { path = "../contracts" }
opencut-media = { path = "../media" }
opencut-asset-store = { path = "../asset-store" }
opencut-project-render = { path = "../project-render" }
opencut-plugin-host = { path = "../plugin-host" }
serde_json = "1"

[dev-dependencies]
opencut-sqlite-store = { path = "../sqlite-store" }
tempfile = "3"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
