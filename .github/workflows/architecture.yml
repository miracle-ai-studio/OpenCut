name: Architecture boundaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and package boundary fixtures
        run: python3 -m unittest discover -s scripts/tests
      - name: Reviewed workspace graph and expiring exceptions
        run: python3 scripts/check-architecture.py
  semantic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pure compiler coverage and application contract tests
        run: cargo test -p opencut-composition -p opencut-editor-application -p opencut-automation -p opencut-job-runtime --locked
  typescript-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix packages/sdk-ts
      - name: SDK transport and boundary negative fixtures
        run: npm test --prefix packages/sdk-ts
      - name: TypeScript runtime import boundaries
        run: npm run boundaries:check --prefix packages/sdk-ts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Editor behavior and module boundaries
        run: npm test --prefix apps/web
      - name: Static production editor
        run: npm run build --prefix apps/web
